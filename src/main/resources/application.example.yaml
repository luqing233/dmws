spring:
  application:
    name: dmws
  datasource:
    dmw:
      url: jdbc:mysql://localhost:3306/dmw
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  main:
    banner-mode: console
    web-application-type: servlet

shiro:
  ws:
    access-token: "your_access_token"
    client:
      enable: true
      url: "ws://127.0.0.1:3001"

logging:
  level:
    root: WARN

dmws:
  bot-id: 0
  bot-name: "机器人名称"
  master: [0]
  file-server-port: 8765
  file-server-host: "127.0.0.1"
  mcp-server-enabled: true
  mcp-server-token: "Bearer xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  mcp:
    economy:
      operator-id: 0 # deprecated; never used as an AI account
      context-secret: "" # 32+ random characters, shared only with trusted AstrBot adapter
    downloader:
      url: "http://localhost:8001/mcp"
      token: "Bearer xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      timeout: 30
      read-timeout: 300
  economy:
    enabled: true
    time-zone: "Asia/Shanghai"
    sign-min: 50
    sign-max: 500
    bank-weekly-rate: 0.005
    raffle-price: 1000
    raffle-ten-price: 10000
    raffle-cooldown-seconds: 60
    raffle-ten-cooldown-seconds: 600
    red-packet-expire-hours: 24
    private-bank-min-capital: 100000
    private-bank-loan-rate: 0.10
    private-bank-max-loan-days: 30
    fishing-rod-price: 500
    fishing-cooldown-seconds: 30
    # 模拟外汇：默认关闭；启用前执行 scripts/migrate_market.sql 并更新 AstrBot guard。
    # enabled 仅为初始状态，主人可发送「开启交易/关闭交易」持久化覆盖。
    # 关闭只禁止新开仓，行情、平仓和还款继续；accepting-opens=false 仍强制暂停新开仓。
    market:
      enabled: false
      accepting-opens: true
      scheduler-enabled: true
      minimum-margin: 100
      position-margin-limit: 5000
      total-margin-limit: 20000
      max-positions: 5
      daily-open-limit: 20
      net-issuance-budget: 1000000
    rob-cooldown-seconds: 300
    rob-fine: 50
    # 到期住院/监禁每15秒扫描；关闭后，状态查询与相关玩法仍会按需结算。
    condition-scheduler-enabled: true
    adventure:
      # 分支依次判断；这是各分支的条件概率，不是总结果占比。
      counter-chance: 0.30
      police-chance: 0.25 # 另加 犯罪值*0.0025，最高0.75
      success-chance: 0.35 # 道具增益另加0.20
      poor-assault-chance: 0.45
      min-steal-rate: 0.05
      max-steal-rate: 0.35
      max-stolen: 5000 # 不允许超过5000
      crime-per-attempt: 5
      crime-per-success: 5
      crime-per-assault: 15
      crime-per-arrest: 10
      # 犯罪值固定每完整60分钟自然下降5点，最低0；离线时间计入。
      bail-max-crime: 10
      bail-base: 100
      bail-per-crime: 20
      diagnosis-per-injury: 10
      light-hourly-fee: 30
      medium-hourly-fee: 80
      severe-hourly-fee: 150

server:
  port: 8002
