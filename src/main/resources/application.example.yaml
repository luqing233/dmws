spring:
  application:
    name: dmws
  datasource:
    dmw:
      url: jdbc:mysql://localhost:3306/dmw
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
    economy:
      url: jdbc:mysql://localhost:3306/economy
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
    hy-economy:
      url: jdbc:mysql://localhost:3306/test
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  main:
    banner-mode: console
    web-application-type: none

shiro:
  ws:
    access-token: "your_access_token"
    client:
      enable: true
      url: "ws://127.0.0.1:3001"

logging:
  level:
    root: WARN
