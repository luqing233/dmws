spring:
  application:
    name: dmws
  datasource:
    dmw:
      url: jdbc:mysql://localhost:3306/dmw
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
    economy:
      url: jdbc:mysql://localhost:3306/economy
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
    hy-economy:
      url: jdbc:mysql://localhost:3306/test
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  main:
    banner-mode: console
    web-application-type: servlet

shiro:
  ws:
    access-token: "your_access_token"
    client:
      enable: true
      url: "ws://127.0.0.1:3001"

logging:
  level:
    root: WARN

dmws:
  ws-url: "ws://127.0.0.1:8080/ws"
  http-url: "http://127.0.0.1:8080"
  max-messages: 40
  bot-id: 0
  bot-name: "机器人名称"
  master: [0]
  file-server-port: 8765
  file-server-host: "127.0.0.1"
  mcp:
    downloader:
      url: "http://localhost:8001/mcp"
      token: "Bearer xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      timeout: 30
      read-timeout: 300

server:
  port: 0
