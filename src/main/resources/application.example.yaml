spring:
  application:
    name: dmws
  datasource:
    dmw:
      url: jdbc:mysql://localhost:3306/dmw
      username: your_username
      password: your_password
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  main:
    banner-mode: console
    web-application-type: servlet

shiro:
  ws:
    access-token: "your_access_token"
    client:
      enable: true
      url: "ws://127.0.0.1:3001"

logging:
  level:
    root: WARN

dmws:
  ws-url: "ws://127.0.0.1:8080/ws"
  http-url: "http://127.0.0.1:8080"
  max-messages: 40
  bot-id: 0
  bot-name: "机器人名称"
  master: [0]
  file-server-port: 8765
  file-server-host: "127.0.0.1"
  mcp-server-enabled: true
  mcp-server-token: "Bearer xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  mcp:
    economy:
      operator-id: 0
    downloader:
      url: "http://localhost:8001/mcp"
      token: "Bearer xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      timeout: 30
      read-timeout: 300
  economy:
    enabled: true
    time-zone: "Asia/Shanghai"
    sign-min: 50
    sign-max: 500
    bank-weekly-rate: 0.005
    raffle-price: 1000
    raffle-ten-price: 10000
    raffle-cooldown-seconds: 60
    raffle-ten-cooldown-seconds: 600
    red-packet-expire-hours: 24
    private-bank-min-capital: 100000
    private-bank-loan-rate: 0.10
    private-bank-max-loan-days: 30
    fishing-rod-price: 500
    fishing-cost: 20
    fishing-cooldown-seconds: 30
    rob-cooldown-seconds: 300
    rob-fine: 50

server:
  port: 8002
